<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SD XC Rankings</title>
    <meta name="description" content="South Dakota high school cross country rankings and race simulator." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Google tag (gtag.js); only reports from the live site, so local dev doesn't pollute analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3HK7FW9Y6N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      if (location.hostname === 'danielburkhalter.dev') {
        gtag('js', new Date());
        gtag('config', 'G-3HK7FW9Y6N');
      }
    </script>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash
      try {
        const t = localStorage.getItem('theme')
        const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
